[project]
name = "ft-ftp-mcp-stdio"
version = "0.3.0"
description = "FTP/SFTP MCP server using the stdio transport."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
keywords = ["mcp", "ftp", "sftp", "stdio", "file-transfer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Internet :: File Transfer Protocol (FTP)",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=4.0.2",
    "keyring>=25.7.0",
    "paramiko>=5.0.0",
]

[project.scripts]
ft-ftp-mcp-stdio = "ft_ftp_mcp_stdio.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/ft_ftp_mcp_stdio"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "types-paramiko>=4.0.0.20250822",
]
