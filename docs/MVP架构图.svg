<svg viewBox="0 0 830 756" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>FT Agent FTP 插件下一版本架构</title>
  <desc>下一版本架构：用户通过 Codex 或 WorkBuddy 以 MCP stdio 调用本插件，插件以原生 FTP/SFTP 协议访问文件服务器；提供 14 个工具、配置向导、只读诊断和 JSONL 使用日志。安全机制包括系统凭据管理、SFTP 认证前主机密钥验证、虚拟路径边界、默认只读、符号链接拒绝、上传临时提交和 staging 隔离。安装环境为 Windows x64 与 Python 3.12，采用单机 stdio 部署。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="830" height="756" fill="#1e1e1e"/>

  <text x="80" y="52" font-size="14" font-weight="500" fill="#F1EFE8" font-family="sans-serif">FT Agent FTP 插件 · 0.3.0 架构</text>

  <g>
    <rect x="80" y="80" width="260" height="68" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
    <text x="210" y="103" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#E6F1FB" font-family="sans-serif">用户</text>
    <text x="210" y="123" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B5D4F4" font-family="sans-serif">自然语言下达任务（涉及 FTP/SFTP 操作）</text>
  </g>

  <line x1="210" y1="148" x2="210" y2="180" stroke="#B4B2A9" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="226" y="164" font-size="12" fill="#B4B2A9" font-family="sans-serif" dominant-baseline="central">对话</text>

  <g>
    <rect x="80" y="180" width="260" height="68" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.5"/>
    <text x="210" y="203" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#EEEDFE" font-family="sans-serif">AI Agent 宿主</text>
    <text x="210" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#CECBF6" font-family="sans-serif">Codex · WorkBuddy</text>
  </g>

  <line x1="210" y1="248" x2="210" y2="300" stroke="#B4B2A9" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="226" y="274" font-size="12" fill="#B4B2A9" font-family="sans-serif" dominant-baseline="central">MCP stdio</text>

  <g>
    <rect x="80" y="300" width="260" height="156" rx="8" fill="#633806" stroke="#FAC775" stroke-width="0.5"/>
    <text x="210" y="324" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#FAEEDA" font-family="sans-serif">FT Agent FTP 插件</text>
    <text x="210" y="346" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FAC775" font-family="sans-serif">MCP Server · 单机 stdio 进程</text>
    <text x="210" y="366" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#FAEEDA" font-family="sans-serif">—— 14 个 MCP 工具 ——</text>
    <text x="210" y="384" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#FAC775" font-family="sans-serif">测试连接 · 列目录 · 搜索文件</text>
    <text x="210" y="402" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#FAC775" font-family="sans-serif">文件信息 · 下载文件 · 上传文件</text>
    <text x="210" y="420" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#FAC775" font-family="sans-serif">新建目录 · 文本预览 · 重命名</text>
    <text x="210" y="438" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#FAC775" font-family="sans-serif">下载目录 · 上传目录 · 移动 · 删除</text>
  </g>

  <line x1="210" y1="456" x2="210" y2="488" stroke="#B4B2A9" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="226" y="472" font-size="12" fill="#B4B2A9" font-family="sans-serif" dominant-baseline="central">原生 FTP / SFTP</text>

  <g>
    <rect x="80" y="488" width="260" height="68" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
    <text x="210" y="511" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#E1F5EE" font-family="sans-serif">FTP / SFTP 服务器</text>
    <text x="210" y="531" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#9FE1CB" font-family="sans-serif">FTP 21 端口 · SFTP 22 端口</text>
  </g>

  <text x="600" y="68" text-anchor="middle" font-size="12" fill="#B4B2A9" font-family="sans-serif" dominant-baseline="central">内置安全机制</text>

  <g>
    <rect x="450" y="80" width="300" height="44" rx="8" fill="#444441" stroke="#888780" stroke-width="0.5"/>
    <text x="600" y="97" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#F1EFE8" font-family="sans-serif">凭据安全</text>
    <text x="600" y="115" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#B4B2A9" font-family="sans-serif">系统钥匙串不落盘 · 支持 SFTP 密钥认证</text>
  </g>

  <g>
    <rect x="450" y="132" width="300" height="44" rx="8" fill="#444441" stroke="#888780" stroke-width="0.5"/>
    <text x="600" y="149" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#F1EFE8" font-family="sans-serif">路径监禁</text>
    <text x="600" y="167" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#B4B2A9" font-family="sans-serif">root 限制 · .. 段拒绝</text>
  </g>

  <g>
    <rect x="450" y="184" width="300" height="44" rx="8" fill="#444441" stroke="#888780" stroke-width="0.5"/>
    <text x="600" y="201" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#F1EFE8" font-family="sans-serif">只读保护</text>
    <text x="600" y="219" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#B4B2A9" font-family="sans-serif">readOnly 默认开启（服务器级）</text>
  </g>

  <g>
    <rect x="450" y="236" width="300" height="44" rx="8" fill="#444441" stroke="#888780" stroke-width="0.5"/>
    <text x="600" y="253" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#F1EFE8" font-family="sans-serif">暂存目录隔离</text>
    <text x="600" y="271" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#B4B2A9" font-family="sans-serif">文件不进上下文</text>
  </g>

  <g>
    <rect x="450" y="288" width="300" height="56" rx="8" fill="#444441" stroke="#888780" stroke-width="0.5"/>
    <text x="600" y="305" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#F1EFE8" font-family="sans-serif">宿主层审批</text>
    <text x="600" y="323" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#B4B2A9" font-family="sans-serif">delete/move 逐调用确认</text>
    <text x="600" y="339" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#B4B2A9" font-family="sans-serif">（Codex）</text>
  </g>

  <text x="600" y="410" text-anchor="middle" font-size="12" fill="#B4B2A9" font-family="sans-serif" dominant-baseline="central">运维配套</text>

  <g>
    <rect x="450" y="424" width="300" height="44" rx="8" fill="#444441" stroke="#888780" stroke-width="0.5"/>
    <text x="600" y="441" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#F1EFE8" font-family="sans-serif">setup 向导</text>
    <text x="600" y="459" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#B4B2A9" font-family="sans-serif">增删 FTP 服务器 · 原子写入</text>
  </g>

  <g>
    <rect x="450" y="476" width="300" height="44" rx="8" fill="#444441" stroke="#888780" stroke-width="0.5"/>
    <text x="600" y="493" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#F1EFE8" font-family="sans-serif">doctor 诊断</text>
    <text x="600" y="511" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#B4B2A9" font-family="sans-serif">环境/凭据/TCP · 只读</text>
  </g>

  <g>
    <rect x="450" y="528" width="300" height="44" rx="8" fill="#444441" stroke="#888780" stroke-width="0.5"/>
    <text x="600" y="545" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#F1EFE8" font-family="sans-serif">JSONL 使用日志</text>
    <text x="600" y="563" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#B4B2A9" font-family="sans-serif">时间/工具/状态 · 不含内容</text>
  </g>

  <g>
    <rect x="80" y="592" width="670" height="84" rx="8" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="415" y="612" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#F1EFE8" font-family="sans-serif">安装形态：离线全量包 → 独立 venv 运行 · 全程不联网 · 无 exe</text>
    <text x="415" y="634" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#F1EFE8" font-family="sans-serif">平台：Windows x64 + Python 3.12 ｜ macOS / Linux 待后续版本</text>
    <text x="415" y="656" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B4B2A9" font-family="sans-serif">MVP 边界：单机 stdio 部署 · 暂不涉及网关 / 集中代理 / Web 管理 / 多用户</text>
  </g>

  <path d="M340 378 H410 V212 H450" fill="none" stroke="#F1EFE8" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M340 440 H410 V486 H450" fill="none" stroke="#F1EFE8" stroke-width="2" stroke-dasharray="5 4"/>
</svg>
